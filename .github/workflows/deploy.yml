name: Refresh rates and deploy Astro site

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-and-rate-refresh
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh channel multipliers
        run: npm run collect-rates
        env:
          RATE_TOKEN_BANK: ${{ secrets.RATE_TOKEN_BANK }}
          RATE_CODEX_FOR: ${{ secrets.RATE_CODEX_FOR }}
          RATE_PINAI: ${{ secrets.RATE_PINAI }}
          RATE_CCVIBE: ${{ secrets.RATE_CCVIBE }}
          RATE_GALAXY: ${{ secrets.RATE_GALAXY }}
          RATE_DIDI: ${{ secrets.RATE_DIDI }}

      - name: Run data tests
        run: npm test

      - name: Commit refreshed rate snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- src/data/auto-rates.json; then
            echo '倍率没有变化，不提交快照。'
            exit 0
          fi
          git add src/data/auto-rates.json
          git commit -m 'chore: refresh channel rates [skip ci]'
          git push

      - name: Build Astro site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
